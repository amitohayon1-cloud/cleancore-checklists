<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>קלין קור – צ'ק ליסט ציוד</title>
  <meta name="theme-color" content="#0b5cab" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="צ'ק ליסט">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="update-bar" class="update-bar" hidden>
    <span>גרסה חדשה זמינה</span>
    <button type="button" id="update-btn" class="btn btn-small">רענן</button>
  </div>

  <!-- מסך ראשי -->
  <main id="home" class="screen">
    <header class="topbar">
      <h1>קלין קור</h1>
      <p class="sub">צ'ק ליסט ציוד לפי מלאכה</p>
    </header>
    <ul id="trade-list" class="trade-list"></ul>
    <p id="home-error" class="error" hidden></p>
    <a href="install.html" id="install-link" class="install-link">📲 התקנה על מסך הבית</a>
    <footer class="home-footer"><span id="version"></span></footer>
  </main>

  <!-- מסך צ'ק ליסט -->
  <main id="checklist" class="screen" hidden>
    <header class="topbar topbar-sticky">
      <div class="topbar-row">
        <button type="button" id="back-btn" class="icon-btn" aria-label="חזרה למסך הראשי">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
        <h1 id="trade-title"></h1>
      </div>
      <div class="progress" aria-live="polite">
        <div class="progress-text" id="progress-text"></div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
    </header>

    <section class="fields">
      <label class="field">
        <span>שם פרויקט</span>
        <input type="text" id="f-project" autocomplete="off" enterkeyhint="next">
      </label>
      <label class="field">
        <span>תאריך ביצוע עבודה</span>
        <input type="date" id="f-date">
      </label>
    </section>

    <p id="base-changed" class="notice" hidden>רשימת הבסיס של המלאכה עודכנה. לחץ "איפוס" כדי לקבל את הרשימה החדשה.</p>

    <ul id="items" class="items"></ul>

    <button type="button" id="add-item" class="add-row">
      <span class="plus" aria-hidden="true">+</span> הוסף סעיף
    </button>

    <div class="spacer"></div>

    <footer class="actions">
      <button type="button" id="reset-btn" class="btn btn-secondary">איפוס</button>
      <button type="button" id="export-btn" class="btn btn-primary">ייצוא ל-PDF</button>
    </footer>
  </main>

  <!-- חלון אישור איפוס -->
  <div id="reset-dialog" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="reset-title">
      <h2 id="reset-title">לאפס את הצ'ק ליסט?</h2>
      <p>כל הסימונים, הכמויות, הסעיפים שנוספו או נמחקו ושם הפרויקט יחזרו לרשימת הבסיס.</p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-secondary" data-close>ביטול</button>
        <button type="button" id="reset-confirm" class="btn btn-danger">כן, לאפס</button>
      </div>
    </div>
  </div>

  <!-- חלון PDF מוכן -->
  <div id="pdf-dialog" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pdf-title">
      <h2 id="pdf-title">ה-PDF מוכן</h2>
      <p id="pdf-name" class="pdf-name"></p>
      <img id="pdf-preview" class="pdf-preview" alt="תצוגה מקדימה של העמוד הראשון">
      <div class="sheet-actions">
        <button type="button" id="pdf-share" class="btn btn-primary">שיתוף / שמירה</button>
        <button type="button" id="pdf-download" class="btn btn-secondary">הורדה</button>
      </div>
      <button type="button" class="btn btn-link" data-close>סגור</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-action" class="btn-link"></button>
  </div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/pdf-template.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
